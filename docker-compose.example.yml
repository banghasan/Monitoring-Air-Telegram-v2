services:
  airpantau-bot:
    image: ghcr.io/banghasan/monitoring-air-telegram-v2:${IMAGE_TAG:-latest}
    container_name: airpantau-bot
    pull_policy: always
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_ROLE: bot
      PORT: 3000
      MONITOR_ENABLED: "false"
      INTERNAL_STATUS_URL: http://airpantau-monitor:3000/internal/status
    command: ["bun", "run", "src/bot.ts"]
    ports:
      - "${BOT_HTTP_PORT:-3000}:3000"
    depends_on:
      airpantau-monitor:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  airpantau-monitor:
    image: ghcr.io/banghasan/monitoring-air-telegram-v2:${IMAGE_TAG:-latest}
    container_name: airpantau-monitor
    pull_policy: always
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_ROLE: monitor
      PORT: 3000
      MONITOR_ENABLED: "true"
      MONITOR_STATE_DB_PATH: /data/state/monitor.sqlite
    command: ["bun", "run", "src/monitor.ts"]
    expose:
      - "3000"
    volumes:
      - monitor_state:/data/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  monitor_state:
