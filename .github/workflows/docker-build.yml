name: Docker Build

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build
        required: true
        default: latest
        type: string
      push:
        description: Push the image to GitHub Container Registry
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gate
        run: bun run check

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Bun version
        id: bun
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BUN_VERSION=${{ steps.bun.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.image_tag }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          provenance: false
          sbom: false
