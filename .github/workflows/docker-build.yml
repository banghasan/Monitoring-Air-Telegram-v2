name: Docker Build

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build
        required: true
        default: latest
        type: string
      push:
        description: Push the image to GitHub Container Registry
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Bun version
        id: bun
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < .bun-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BUN_VERSION=${{ steps.bun.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          provenance: false
          sbom: false
